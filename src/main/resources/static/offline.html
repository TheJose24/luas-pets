<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f766e">
    <title>Sin conexión · Luas Pets</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center;
            background: #f8fafc; color: #0f172a; font-family: system-ui, sans-serif; }
        main { max-width: 30rem; margin: 1.5rem; padding: 2rem; background: #fff;
            border: 1px solid #e5e7eb; border-radius: 1rem; }
        h1 { font-size: 1.5rem; } p { color: #64748b; line-height: 1.6; }
        .brand { color: #0f766e; font-weight: 800; }
        a { display: inline-block; padding: .8rem 1.2rem; background: #0f766e;
            color: #fff; border-radius: .5rem; text-decoration: none; }
        a:focus-visible { outline: 3px solid #14b8a6; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <div class="brand">Luas Pets</div>
        <h1>No podemos conectar con el servidor</h1>
        <p>Comprueba tu conexión a Internet y vuelve a intentarlo.
            Para consultar o actualizar información necesitas estar en línea.</p>
        <a href="/">Volver a intentar</a>
    </main>
</body>
</html>
