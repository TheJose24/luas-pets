<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
<title>Verificación en dos pasos — LUAS Pets</title>
</head>
<body>
<main class="container py-5" style="max-width:560px">
<div class="card border-0 shadow-sm p-4">
<h1 class="h4">LUAS Pets · Verificación en dos pasos</h1>
<div class="lp-alert lp-alert-danger" th:if="${error}" th:text="${error}">
</div>
<p>Ingresa el código de tu aplicación autenticadora para acceder a tu cuenta.</p>
<form th:action="@{/2fa}" method="post">
<label for="codigo">Código de 6 dígitos</label>
<input class="form-control mb-3" id="codigo" name="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
<button class="lp-btn-primary border-0" type="submit">Verificar</button>
</form>
<details class="mt-4">
<summary>Usar un código de recuperación</summary>
<form th:action="@{/2fa}" method="post">
<input type="hidden" name="recuperacion" value="true">
<label for="recovery">Código de recuperación</label>
<input class="form-control mb-3" id="recovery" name="codigo" autocomplete="off" pattern="[A-Fa-f0-9]{20}" maxlength="20" required>
<button class="btn btn-outline-primary" type="submit">Usar código</button>
</form>
</details>
<hr>
<form th:action="@{/logout}" method="post">
<button class="btn btn-outline-secondary" type="submit">Cerrar sesión</button>
</form>
</div>
</main>
</body>
</html>
