<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Detalle del pedido - Luas Pets</title>
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('admin', 'pedidos')}"></div>

<div class="lp-main">
    <div th:replace="~{fragments/layout :: topbar('Detalle del pedido')}"></div>
    <div th:replace="~{fragments/layout :: breadcrumb('Pedidos', '/admin/pedidos', 'Detalle del pedido')}"></div>

    <div class="container-fluid p-4 pt-2">
        <a th:href="@{/admin/pedidos}" class="lp-btn-outline mb-3 d-inline-block">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>

        <div class="mb-4">
            <h1 class="lp-page-title">Detalle del pedido</h1>
            <p class="lp-page-subtitle">Revisa los productos del pedido y actualiza su estado.</p>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-12 col-lg-6">
                <div class="lp-card p-4 h-100">
                    <h6 class="text-uppercase small fw-semibold mb-3" style="color: var(--lp-muted);">Datos del pedido</h6>
                    <p class="mb-1"><strong>N° pedido:</strong> <span th:text="${pedido.id}"></span></p>
                    <p class="mb-1"><strong>Fecha:</strong>
                        <span th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}"></span>
                    </p>
                    <p class="mb-0"><strong>Total:</strong>
                        <span style="color: var(--lp-primary); font-weight: 700;"
                            th:text="'S/ ' + ${#numbers.formatDecimal(pedido.total, 1, 2)}"></span>
                    </p>
                </div>
            </div>
            <div class="col-12 col-lg-6">
                <div class="lp-card p-4 h-100">
                    <h6 class="text-uppercase small fw-semibold mb-3" style="color: var(--lp-muted);">Datos del cliente</h6>
                    <p class="mb-1"><strong>Nombre:</strong>
                        <span th:text="${pedido.cliente.nombre} + ' ' + ${pedido.cliente.apellido}"></span>
                    </p>
                    <p class="mb-0"><strong>Email:</strong> <span th:text="${pedido.cliente.email}"></span></p>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-12 col-lg-8">
                <div class="lp-card p-0">
                    <div class="table-responsive">
                        <table class="lp-table mb-0">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Cantidad</th>
                                    <th>Precio unitario</th>
                                    <th>Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="detalle : ${pedido.detalles}">
                                    <td class="fw-semibold" th:text="${detalle.producto.nombre}">Producto</td>
                                    <td th:text="${detalle.cantidad}">1</td>
                                    <td th:text="'S/ ' + ${#numbers.formatDecimal(detalle.precioUnitario, 1, 2)}">S/ 0.00</td>
                                    <td th:text="'S/ ' + ${#numbers.formatDecimal(detalle.subtotal, 1, 2)}">S/ 0.00</td>
                                </tr>
                            </tbody>
                            <tfoot>
                                <tr>
                                    <th colspan="3" class="text-end">Total</th>
                                    <th style="font-size: 1.15rem; color: var(--lp-primary);"
                                        th:text="'S/ ' + ${#numbers.formatDecimal(pedido.total, 1, 2)}">S/ 0.00</th>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-4">
                <div class="lp-card p-4">
                    <h6 class="text-uppercase small text-muted mb-3">Actualizar estado</h6>
                    <form th:action="@{/admin/pedidos/{id}/estado(id=${pedido.id})}" method="post">
                        <select class="form-select mb-3" id="nuevoEstado" name="nuevoEstado">
                            <option value="PENDIENTE" th:selected="${pedido.estado.name() == 'PENDIENTE'}">Pendiente</option>
                            <option value="CONFIRMADO" th:selected="${pedido.estado.name() == 'CONFIRMADO'}">Confirmado</option>
                            <option value="ENTREGADO" th:selected="${pedido.estado.name() == 'ENTREGADO'}">Entregado</option>
                        </select>
                        <button type="submit" class="lp-btn-primary border-0 w-100 text-center">
                            <i class="bi bi-check-lg me-1"></i>Actualizar
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <a th:href="@{/admin/pedidos}" class="lp-btn-outline mt-4 d-inline-block">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
