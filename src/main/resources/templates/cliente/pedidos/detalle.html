<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Detalle del pedido - Luas Pets</title>
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('cliente', 'pedidos')}"></div>

<div class="lp-main">
    <div th:replace="~{fragments/layout :: topbar('Detalle del pedido')}"></div>
    <div th:replace="~{fragments/layout :: breadcrumb('Mis pedidos', '/cliente/pedidos', 'Detalle del pedido')}"></div>

    <div class="container-fluid p-4 pt-2">
        <a th:href="@{/cliente/pedidos}" class="lp-btn-outline mb-3 d-inline-block">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>

        <div class="mb-4">
            <h1 class="lp-page-title">Detalle del pedido</h1>
            <p class="lp-page-subtitle">Revisa los productos y el estado de tu compra.</p>
        </div>

        <div class="lp-card p-4 mb-4">
            <div class="row g-2">
                <div class="col-12 col-md-4">
                    <span class="lp-data-label d-block text-uppercase small" style="color: var(--lp-muted);">N° pedido</span>
                    <span class="fw-semibold" th:text="${pedido.id}"></span>
                </div>
                <div class="col-12 col-md-4">
                    <span class="lp-data-label d-block text-uppercase small" style="color: var(--lp-muted);">Fecha</span>
                    <span class="fw-semibold" th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}"></span>
                </div>
                <div class="col-12 col-md-4">
                    <span class="lp-data-label d-block text-uppercase small" style="color: var(--lp-muted);">Estado</span>
                    <span class="lp-badge"
                        th:classappend="${pedido.estado.name() == 'PENDIENTE'} ? 'lp-badge-warning' :
                                         (${pedido.estado.name() == 'CONFIRMADO'} ? 'lp-badge-info' : 'lp-badge-success')"
                        th:text="${pedido.estado}">Estado</span>
                </div>
            </div>
        </div>

        <div class="lp-card p-0 mb-4">
            <div class="table-responsive">
                <table class="lp-table mb-0">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio unitario</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="detalle : ${pedido.detalles}">
                            <td class="fw-semibold" th:text="${detalle.producto.nombre}">Producto</td>
                            <td th:text="${detalle.cantidad}">1</td>
                            <td th:text="'S/ ' + ${#numbers.formatDecimal(detalle.precioUnitario, 1, 2)}">S/ 0.00</td>
                            <td th:text="'S/ ' + ${#numbers.formatDecimal(detalle.subtotal, 1, 2)}">S/ 0.00</td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <th colspan="3" class="text-end">Total</th>
                            <th style="font-size: 1.15rem; color: var(--lp-primary);"
                                th:text="'S/ ' + ${#numbers.formatDecimal(pedido.total, 1, 2)}">S/ 0.00</th>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <a th:href="@{/cliente/pedidos}" class="lp-btn-outline">
            <i class="bi bi-arrow-left me-1"></i>Volver a mis pedidos
        </a>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
