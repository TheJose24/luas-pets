<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Mis pedidos - Luas Pets</title>
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('cliente', 'pedidos')}"></div>

<div class="lp-main">
    <div th:replace="~{fragments/layout :: topbar('Mis pedidos')}"></div>
    <div th:replace="~{fragments/layout :: breadcrumb(null, null, 'Mis pedidos')}"></div>

    <div class="container-fluid p-4 pt-2">
        <div class="d-flex flex-column flex-md-row justify-content-md-between align-items-md-center gap-3 mb-4">
            <div>
                <h1 class="lp-page-title">Mis pedidos</h1>
                <p class="lp-page-subtitle">Historial de tus compras en la tienda.</p>
            </div>
            <button type="button" id="btnAbrirCarrito" class="lp-btn-outline flex-shrink-0 position-relative"
                data-bs-toggle="offcanvas" data-bs-target="#carritoPanel" aria-controls="carritoPanel">
                <i class="bi bi-cart3 me-1"></i>Carrito
                <span id="carritoContador" class="position-absolute top-0 start-100 translate-middle badge rounded-pill"
                    style="background-color: var(--lp-primary); color: #ffffff; font-size: 0.7rem;">0</span>
            </button>
        </div>

        <div class="lp-alert lp-alert-success" th:if="${param.exito}">
            <i class="bi bi-check-circle"></i> Pedido realizado correctamente
        </div>

        <div th:if="${#lists.isEmpty(pedidos)}" class="lp-card lp-empty-state">
            <i class="bi bi-bag-x"></i>
            <h5 class="fw-bold mb-1">Aún no tienes pedidos realizados</h5>
            <p class="mb-3">Explora la tienda y realiza tu primera compra.</p>
            <a th:href="@{/cliente/tienda}" class="lp-btn-primary">
                <i class="bi bi-shop me-1"></i>Ir a la tienda
            </a>
        </div>

        <div class="lp-card p-0" th:unless="${#lists.isEmpty(pedidos)}">
            <div class="table-responsive">
                <table class="lp-table mb-0">
                    <thead>
                        <tr>
                            <th>N° pedido</th>
                            <th><i class="bi bi-calendar3 me-1"></i>Fecha</th>
                            <th>Productos</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="pedido : ${pedidos}">
                            <td class="fw-semibold" th:text="${pedido.id}">1</td>
                            <td th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                            <td th:text="${#lists.size(pedido.detalles)}">0</td>
                            <td th:text="'S/ ' + ${#numbers.formatDecimal(pedido.total, 1, 2)}">S/ 0.00</td>
                            <td>
                                <span class="lp-badge"
                                    th:classappend="${pedido.estado.name() == 'PENDIENTE'} ? 'lp-badge-warning' :
                                                     (${pedido.estado.name() == 'CONFIRMADO'} ? 'lp-badge-info' : 'lp-badge-success')"
                                    th:text="${pedido.estado}">Estado</span>
                            </td>
                            <td>
                                <a th:href="@{/cliente/pedidos/{id}(id=${pedido.id})}"
                                    class="lp-btn-outline btn-sm py-1 px-2">
                                    <i class="bi bi-eye me-1"></i>Ver detalle
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: carritoPanel}"></div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
