<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Reprogramar cita - Luas Pets</title>
</head>
<body>

<div th:replace="~{fragments/layout :: sidebar('cliente', 'citas')}"></div>

<div class="lp-main">
    <div th:replace="~{fragments/layout :: topbar('Reprogramar cita')}"></div>
    <div th:replace="~{fragments/layout :: breadcrumb('Mis citas', '/cliente/citas', 'Reprogramar')}"></div>

    <div class="container-fluid p-4 pt-2">
        <a th:href="@{/cliente/citas}" class="lp-btn-outline mb-3 d-inline-block">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>

        <div class="mb-4">
            <h1 class="lp-page-title">Reprogramar cita</h1>
            <p class="lp-page-subtitle">Elige una nueva fecha y hora para tu cita.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="lp-alert lp-alert-danger" th:if="${error}">
                    <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
                </div>

                <div class="lp-card p-4 p-md-5">
                    <div class="lp-data-box mb-4">
                        <h6 class="text-uppercase small fw-semibold mb-3" style="color: var(--lp-muted);">Datos actuales de la cita</h6>
                        <p class="mb-1"><i class="bi bi-heart me-2" style="color: var(--lp-primary);"></i><strong>Mascota:</strong> <span th:text="${cita.mascota.nombre}"></span></p>
                        <p class="mb-1"><i class="bi bi-person-badge me-2" style="color: var(--lp-primary);"></i><strong>Doctor:</strong>
                            <span th:text="${cita.doctor.nombre} + ' ' + ${cita.doctor.apellido}"></span>
                        </p>
                        <p class="mb-0"><i class="bi bi-calendar3 me-2" style="color: var(--lp-primary);"></i><strong>Fecha actual:</strong>
                            <span th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}"></span>
                        </p>
                    </div>

                    <form th:action="@{/cliente/citas/{id}/reprogramar(id=${cita.id})}" method="post"
                        class="needs-validation" novalidate>

                        <div class="mb-4">
                            <label for="nuevaFechaHora" class="form-label fw-medium">Nueva fecha y hora</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-calendar3"></i></span>
                                <input type="datetime-local" class="form-control" id="nuevaFechaHora" name="nuevaFechaHora"
                                    th:min="${minFechaHora}"
                                    required />
                                <div class="invalid-feedback">Selecciona una fecha y hora válida (no puede ser en el pasado)</div>
                            </div>
                            <div class="form-text">El horario de atención es de 8:00 a 20:00.</div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/cliente/citas}" class="lp-btn-outline">
                                <i class="bi bi-arrow-left me-1"></i>Volver
                            </a>
                            <button type="submit" class="lp-btn-primary border-0">
                                <i class="bi bi-arrow-repeat me-1"></i>Reprogramar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
