spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.thymeleaf.cache=true
spring.jpa.open-in-view=false
logging.level.root=WARN
logging.level.com.luaspets=INFO

# ==========================================
# POOL DE CONEXIONES (plan gratuito de Aiven: limite bajo de conexiones simultaneas)
# ==========================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ==========================================
# COMPRESION DE RESPUESTAS
# ==========================================
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
