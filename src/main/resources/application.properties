spring.application.name=luas-pets

# ==========================================
# BASE DE DATOS MYSQL
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:luas_pets}?createDatabaseIfNotExist=${DB_CREATE:true}&useSSL=${DB_SSL:false}&requireSSL=${DB_REQUIRE_SSL:false}&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# THYMELEAF
# ==========================================
spring.thymeleaf.cache=false

# ==========================================
# SERVIDOR
# ==========================================
server.port=${PORT:${SERVER_PORT:8080}}
